name: Süper Lig Transfer Bot

on:
  schedule:
    - cron: "*/30 10-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testlauf ohne zu posten"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: transfer-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --omit=dev

      - name: Bot ausführen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_APP_KEY:         ${{ secrets.X_APP_KEY }}
          X_APP_SECRET:      ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: npm start

      - name: Gedächtnis speichern
        if: always()
        run: |
          git config user.name  "transfer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          git commit -m "chore: update seen.json [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
